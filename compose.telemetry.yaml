services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: family-jobs-board-api
      OTEL_SERVICE_VERSION: ${IMAGE_TAG:-local}
      Telemetry__Environment: ${TELEMETRY_ENVIRONMENT:-production}
    networks:
      - default
      - telemetry

networks:
  telemetry:
    name: family-jobs-board-telemetry
    external: true
