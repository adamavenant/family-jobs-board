services:
  blackbox:
    extra_hosts:
      - "${APP_PROBE_HOSTNAME:-dashboard.home.arpa}:${APP_PROBE_ADDRESS:?APP_PROBE_ADDRESS must be set to the LAN address used for application probes}"

  grafana:
    networks:
      query:
      monitor-ingress:
        aliases:
          - observability-grafana

networks:
  monitor-ingress:
    name: ${MONITOR_INGRESS_NETWORK_NAME:-family-jobs-board-monitor-ingress}
    external: true
