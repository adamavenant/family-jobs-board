global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: observability

storage:
  tsdb:
    retention:
      time: 30d
      size: 1600MB

otlp:
  promote_resource_attributes:
    - service.name
    - deployment.environment.name

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus
    relabel_configs:
      - target_label: instance
        replacement: prometheus

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: loki
    relabel_configs:
      - target_label: instance
        replacement: loki

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345
        labels:
          service: alloy
    relabel_configs:
      - target_label: instance
        replacement: alloy

  - job_name: blackbox
    static_configs:
      - targets:
          - blackbox:9115
        labels:
          service: blackbox
    relabel_configs:
      - target_label: instance
        replacement: blackbox

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: serendipity
    relabel_configs:
      - target_label: instance
        replacement: serendipity

  - job_name: family-jobs-board-containers
    static_configs:
      - targets:
          - container-exporter:9400
        labels:
          collector: family-jobs-board-containers
    relabel_configs:
      - target_label: instance
        replacement: serendipity

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets:
          - query-gateway:8080
        labels:
          service: grafana
    relabel_configs:
      - target_label: instance
        replacement: grafana

  - job_name: service-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://prometheus:9090/-/ready
        labels:
          service: prometheus
      - targets:
          - http://loki:3100/ready
        labels:
          service: loki
      - targets:
          - http://alloy:12345/-/ready
        labels:
          service: alloy
      - targets:
          - http://blackbox:9115/
        labels:
          service: blackbox
      - targets:
          - http://query-gateway:8080/grafana/api/health
        labels:
          service: grafana
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - service
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: family-jobs-board-service-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://dashboard.home.arpa/health
        labels:
          service: web
          check: public
      - targets:
          - http://dashboard.home.arpa/api/health/live
        labels:
          service: api-live
          check: live
      - targets:
          - http://dashboard.home.arpa/api/health/ready
        labels:
          service: api-ready
          check: readiness
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - service
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
