worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=5s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_body_buffer_size 64k;
    client_max_body_size 64k;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 5s;

    map $uri $query_path_allowed {
        default 0;

        ~^/prometheus/api/v1/(query|query_range|series|labels|metadata|query_exemplars)$ 1;
        ~^/prometheus/api/v1/label/[A-Za-z_][A-Za-z0-9_]*/values$ 1;
        /prometheus/api/v1/status/buildinfo 1;

        /loki/ready 1;
        ~^/loki/loki/api/v1/(query|query_range|series|labels)$ 1;
        ~^/loki/loki/api/v1/label/[A-Za-z_][A-Za-z0-9_]*/values$ 1;
        ~^/loki/loki/api/v1/index/(stats|volume)$ 1;
        /loki/loki/api/v1/status/buildinfo 1;

        /grafana/metrics 1;
        /grafana/api/health 1;
    }

    map "$request_method:$uri" $query_request_allowed {
        default 0;

        ~^(GET|POST):/prometheus/api/v1/(query|query_range|series|labels|query_exemplars)$ 1;
        ~^(GET|POST):/prometheus/api/v1/label/[A-Za-z_][A-Za-z0-9_]*/values$ 1;
        GET:/prometheus/api/v1/metadata 1;
        GET:/prometheus/api/v1/status/buildinfo 1;

        GET:/loki/ready 1;
        ~^(GET|POST):/loki/loki/api/v1/(query|query_range|series|labels)$ 1;
        ~^(GET|POST):/loki/loki/api/v1/label/[A-Za-z_][A-Za-z0-9_]*/values$ 1;
        ~^GET:/loki/loki/api/v1/index/(stats|volume)$ 1;
        GET:/loki/loki/api/v1/status/buildinfo 1;

        GET:/grafana/metrics 1;
        GET:/grafana/api/health 1;
    }

    upstream prometheus_query_backend {
        server prometheus:9090;
    }

    upstream loki_query_backend {
        server loki:3100;
    }

    upstream grafana_observation_backend {
        zone grafana_observation_backend 64k;
        server grafana:3000 resolve;
    }

    server {
        listen 8080;
        server_name _;

        if ($query_path_allowed = 0) {
            return 404;
        }

        if ($query_request_allowed = 0) {
            return 405;
        }

        # Strip the private routing prefix only after the request has matched
        # the exact method-and-path allowlist above.
        location ^~ /prometheus/ {
            rewrite ^/prometheus(/.*)$ $1 break;
            proxy_pass http://prometheus_query_backend;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Grafana-User "";
            proxy_set_header X-Real-IP "";
        }

        location ^~ /loki/ {
            rewrite ^/loki(/.*)$ $1 break;
            proxy_pass http://loki_query_backend;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Grafana-User "";
            proxy_set_header X-Real-IP "";
        }

        # Prometheus and Blackbox reach only Grafana's own metrics and health
        # endpoints through this bridge; Grafana remains off the backend network.
        location ^~ /grafana/ {
            rewrite ^/grafana(/.*)$ $1 break;
            proxy_pass http://grafana_observation_backend;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Grafana-User "";
            proxy_set_header X-Real-IP "";
        }
    }
}
