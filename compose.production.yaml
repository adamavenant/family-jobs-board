services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in the deployment environment file}

  migrate:
    environment:
      ConnectionStrings__Database: Host=db;Port=5432;Database=family_jobs_board;Username=family_jobs_board;Password=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in the deployment environment file}
      Household__TimeZone: ${HOUSEHOLD_TIME_ZONE:-Africa/Johannesburg}

  api:
    environment:
      ConnectionStrings__Database: Host=db;Port=5432;Database=family_jobs_board;Username=family_jobs_board;Password=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in the deployment environment file}
      Household__TimeZone: ${HOUSEHOLD_TIME_ZONE:-Africa/Johannesburg}
      ASPNETCORE_ENVIRONMENT: Production

  web:
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:3000"

  app-links:
    command:
      - /bin/sh
      - -c
      - |
        echo "Family Jobs Board is ready"
        echo "Web is published on ${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}"
        echo "The API and database are private to the Compose network"
        exec tail -f /dev/null
